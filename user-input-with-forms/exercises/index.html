<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rocket Simulation</title>
    <style>
    input[type="checkbox"] {
      accent-color: blue; 
    }
   select {
      appearance: none; /* Remove the default dropdown arrow */
      -webkit-appearance: none; /* For Safari */
      -moz-appearance: none; /* For Firefox */
      background-color: white;
      color: black;
      border: 2px solid blue; /* Blue border */
      padding: 8px;
      font-size: 16px;
      border-radius: 4px;
      background-image: linear-gradient(45deg, transparent 50%, blue 50%),
                        linear-gradient(135deg, blue 50%, transparent 50%);
      background-position: right 12px center, right 5px center;
      background-size: 8px 8px, 8px 8px;
      background-repeat: no-repeat;
    }

    /* Ensure consistent width */
    select {
      width: 200px;
    }

    select:focus {
      border: 2px solid blue; 
      box-shadow: 5px blue; 
      outline: none; 
    }

        input[type="radio"]:checked {accent-color: blue; }
      label { display: block; margin-bottom: 7px;}
    </style>
      
  </head>
 
  <body>
    <h1>Rocket Simulation</h1>
    <form action="https://handlers.education.launchcode.org/request-parrot" method="POST">
      <label>Test Name
        <input type="text" name="testName"/>
      </label>
      
      <label>Test Date
        <input type="date" name="testDate"/>
      </label>
      <label >Rocket Type</label>
      <select id="rocketType" name="rocketType">
        <option value="lynx">Lynx</option>
        <option value="falcon">Falcon</option>
        <option value="dragon">Dragon</option>
      </select>
      <label>Number of Rocket Boosters
        <input type="text" name="numBoosters"/>
      </label>
      <label>Wind Rating:</label>
      <label >
        <input type="radio" name="windRating" value="No Wind" required> No Wind
      </label>
      <label >
        <input type="radio" name="windRating" value="Mild"> Mild
      </label>
      <label >
        <input type="radio" name="windRating" value="Strong"> Strong
      </label>
      <label >Use production grade servers
        <input type="checkbox" name="prodGradServ" value="yes" />
      </label>
      <button type="submit">Run Simulation</button>
    </form>
  </body>
  
</html>
